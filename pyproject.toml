[project]
name = "nigerian-english-asr-api"
version = "2.1.0"
description = "High-performance, production-ready Speech-to-Text & real-time streaming API powered by NCAIR1/NigerianAccentedEnglish"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "pydantic-settings>=2.7.0",
    "faster-whisper>=1.1.0",
    "ctranslate2>=4.5.0",
    "transformers>=5.0.0",
    "huggingface-hub>=0.29.0",
    "accelerate>=1.3.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
