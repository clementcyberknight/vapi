name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install lightweight test dependencies (no model download)
        run: |
          uv venv
          uv pip install fastapi uvicorn[standard] python-multipart aiofiles pydantic-settings numpy pytest pytest-asyncio httpx ruff

      - name: Lint with Ruff
        run: .venv/bin/ruff check app tests examples

      - name: Run unit tests
        run: .venv/bin/pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configs (Coolify/Proxy, Local, & GPU)
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.local.yaml config -q
          docker compose -f compose.yaml -f compose.gpu.yaml config -q

      - name: Build Docker image (CPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
